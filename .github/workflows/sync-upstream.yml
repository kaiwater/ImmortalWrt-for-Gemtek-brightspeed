name: Sync Upstream (naoki66)

# 每次只做「拉取 + 合并 + 推送」，定制内容全部放在 custom/ 目录，
# 因此上游更新不会覆盖本仓库的插件清单、后台地址等定制。
#
# 只跟随 naoki66 的树，不再直接合并 immortalwrt/immortalwrt：
# immortalwrt 由 naoki66 负责合并，本仓库再直连上游只会制造重复合并和冲突。
# （历史上这里同时拉 immortalwrt，冲突时靠「跳过 + 警告」兜底，实际上并没有必要。）

on:
  schedule:
    - cron: '0 19 */3 * *'
  workflow_dispatch:
    inputs:
      trigger_build:
        description: '同步成功后是否自动触发固件构建'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: xr1710g-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 冲突时保留本仓库版本（.gitattributes 中标记 merge=keep-ours 的文件使用该驱动）
          git config merge.keep-ours.name "keep our version on conflict"
          git config merge.keep-ours.driver true
          # 只在 CI 生效的属性文件：本仓库定制的 workflow 冲突时保留自己的版本。
          # 放在 .git/info/attributes（不进版本库），这样 .gitattributes 始终跟随上游、不再冲突。
          printf '%s\n' \
            '.github/workflows/build-firmware.yml merge=keep-ours' \
            '.github/workflows/sync-upstream.yml merge=keep-ours' \
            > .git/info/attributes

      - name: Add upstream remote
        run: |
          # 注意：naoki66 的仓库改过名（旧名 ImmortalWrt-for-Gemtek-XR1710G）。
          # GitHub 对改名仓库做永久重定向，新旧 URL 指向同一个仓库，
          # 所以这里写哪个都能 fetch 到 —— 仓库改名不是同步失败的原因。
          git remote add parent https://github.com/naoki66/ImmortalWrt-for-Gemtek-brightspeed.git 2>/dev/null || true
          git remote set-url parent https://github.com/naoki66/ImmortalWrt-for-Gemtek-brightspeed.git

      - name: Fetch upstream
        run: |
          git fetch --no-tags parent +refs/heads/master:refs/remotes/parent/master

      - name: Merge updates
        id: merge
        run: |
          ref=parent/master
          if git merge-base --is-ancestor "$ref" HEAD; then
            echo "== $ref：没有新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ahead="$(git rev-list --count HEAD.."$ref")"
          echo "== $ref：领先 HEAD ${ahead} 个提交，尝试合并"

          if git merge --no-edit "$ref"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "merged=$ref" >> "$GITHUB_OUTPUT"
            echo "已合并：$ref"
            exit 0
          fi

          # 冲突了。这里故意不自动兜底：本仓库与上游在少量文件上是「双方都改过」的
          # 实质分歧（目前是 README.md 与 feeds.conf.default），自动选一边会把另一边的
          # 改动悄悄丢掉。宁可失败并留下冲突清单，让人工决定。
          echo "::error::合并 $ref 出现冲突，需要人工处理。冲突文件："
          git diff --name-only --diff-filter=U
          echo "::error::解完冲突后重新跑一次本工作流即可。"
          git merge --abort || true
          exit 1

      - name: Check upstream workflow drift
        if: always()
        run: |
          recorded="$(tr -d '[:space:]' < custom/upstream/build-firmware.yml.sha 2>/dev/null || true)"
          current="$(git rev-parse parent/master:.github/workflows/build-firmware.yml 2>/dev/null || true)"
          echo "上游 build-firmware.yml blob=$current（本仓库记录的 hook 基线=$recorded）"
          if [ -n "$recorded" ] && [ -n "$current" ] && [ "$recorded" != "$current" ]; then
            echo "::warning::naoki66 更新了 .github/workflows/build-firmware.yml，本仓库仍用自己的定制版，需要手工把上游新改动合进来"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Trigger firmware build
        if: ${{ steps.merge.outputs.changed == 'true' && (github.event_name == 'schedule' || github.event.inputs.trigger_build != 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run build-firmware.yml --repo "${{ github.repository }}" --ref master -f release_type=release; then
            echo "已触发固件构建：Build XR1710G Firmware"
          else
            echo "::warning::自动触发构建失败，请手动运行 Build XR1710G Firmware"
          fi

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          echo "本次已合并：${{ steps.merge.outputs.merged }}"
          git log --oneline -5 || true
          git status --short || true
